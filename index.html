<title>おなかログ</title>
<style>
:root{--bg:#f6f7f8;--card:#fff;--text:#1c1f23;--sub:#6b7280;--line:#e8eaed;--accent:#0f9d8a;--accent-weak:#e3f5f2;--accent-text:#0b7a6b;--meal-weak:#fff4de;--meal-text:#9a5b00;--bad:#e5484d;--bad-weak:#fdecec;--shadow:0 1px 2px rgba(16,24,40,.05)}
[data-theme=dark]{--bg:#0e1113;--card:#181c1f;--text:#eceff1;--sub:#9aa3ab;--line:#262b30;--accent:#2cc4ae;--accent-weak:#12332e;--accent-text:#6fe3d1;--meal-weak:#3a2f14;--meal-text:#ffd082;--bad:#ff6b70;--bad-weak:#3b1a1c;--shadow:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;-webkit-text-size-adjust:100%}
.app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(150px + env(safe-area-inset-bottom))}
h1{font-size:24px;margin:4px 0 2px;letter-spacing:.02em}
h2{margin:0;font-size:19px}
.sub{color:var(--sub);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow);margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:15px}
.btn{appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:14px;padding:12px 16px;font:inherit;font-weight:600;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--bad)}
.btn.block{display:block;width:100%}
.btn.small{padding:8px 12px;font-size:14px}
.row{display:flex;gap:10px}
.row>*{flex:1}
.stack>*{margin-bottom:8px}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;color:var(--sub);font:inherit;font-weight:600;font-size:15px;padding:9px 6px;border-radius:9px}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.14)}
#adds{position:fixed;left:0;right:0;bottom:calc(57px + env(safe-area-inset-bottom));z-index:15;pointer-events:none;padding:26px 16px 10px;background:linear-gradient(to top,var(--bg) 55%,transparent)}
#adds .in{max-width:560px;margin:0 auto;display:flex;gap:10px}
#adds .btn{flex:1;pointer-events:auto;padding:16px;font-size:17px;border-color:transparent;box-shadow:0 2px 8px rgba(0,0,0,.14)}
.add-meal{background:var(--meal-weak);color:var(--meal-text)}
.add-stool{background:var(--accent-weak);color:var(--accent-text)}
.banner{background:var(--meal-weak);color:var(--meal-text);border-radius:12px;padding:10px 12px;font-size:13px;display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.banner .btn{padding:6px 10px;font-size:13px;border-radius:10px;white-space:nowrap}
.day{display:flex;align-items:center;gap:8px;margin:16px 2px 6px;color:var(--sub);font-size:13px;font-weight:600}
.entry{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:6px;cursor:pointer}
.entry .t{width:40px;flex:none;color:var(--sub);font-size:13px;font-variant-numeric:tabular-nums}
.entry .body{flex:1;min-width:0;line-height:1.5;display:flex;gap:6px;align-items:flex-start}
.entry .tag{flex:none;margin-top:1px}
.entry .c{flex:1;min-width:0}
.entry .text{font-size:15px}
.entry .chip{font-size:11px;padding:1px 7px;margin-left:4px;display:inline-block}
.entry .memo{margin-left:6px}
.entry .thumb{width:44px;height:44px;border-radius:8px}
.tag{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px}
.tag.meal{background:var(--meal-weak);color:var(--meal-text)}
.tag.ok{background:var(--accent-weak);color:var(--accent-text)}
.tag.warn{background:var(--meal-weak);color:var(--meal-text)}
.tag.bad{background:var(--bad-weak);color:var(--bad)}
.text{font-size:16px;word-break:break-word}
.thumb{width:56px;height:56px;border-radius:10px;object-fit:cover;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:13px;padding:5px 11px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--text)}
.chips.small .chip{font-size:12px;padding:2px 8px}
.chip.tap{cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.memo{font-size:13px;color:var(--sub)}
.calhead{display:flex;align-items:center;gap:6px;margin:4px 0 8px}
.caltitle{flex:1;text-align:center;font-weight:700;font-size:17px}
.calnav{width:44px;height:44px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;font-size:24px;line-height:1;padding:0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{text-align:center;font-size:12px;color:var(--sub);padding:2px 0}
.dow.sun{color:var(--bad)}
.dow.sat{color:#3b82f6}
.cell{height:52px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:5px 2px 4px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;font:inherit;color:var(--text);min-width:0}
.cell.blank{border:0;background:transparent}
.cell .dn{font-size:14px;font-weight:600;line-height:1.2}
.cell .sc{display:flex;gap:5px;height:16px;line-height:16px}
.cell .sc i{font-style:normal;font-size:13px;font-weight:700}
.cy{color:#d98e00}.cg{color:#1ea85a}.cr{color:var(--bad)}
.cell .dots i{width:7px;height:7px;border-radius:50%;display:block}
.dm{background:#f59e0b}
.ds{background:var(--accent)}
.cell.bad{background:var(--bad-weak);border-color:transparent}
.cell.bad .dn{color:var(--bad)}
.cell.today{border:2px solid var(--accent)}
.cell.sel{box-shadow:0 0 0 2px var(--accent)}
.lg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.empty{color:var(--sub);text-align:center;padding:36px 12px;font-size:14px}
.wrap{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;z-index:60}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92%;display:flex;flex-direction:column;overflow:hidden;border-radius:22px 22px 0 0}
.sheet-head{display:flex;justify-content:space-between;align-items:center;padding:16px 16px 10px}
.sheet-body{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:4px 16px 18px}
.sheet-foot{padding:10px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--card)}
.x{border:0;background:var(--bg);color:var(--sub);width:34px;height:34px;border-radius:50%;font-size:20px;line-height:1}
.form{display:grid;gap:16px}
.lab{font-size:13px;font-weight:600;color:var(--sub);margin-bottom:6px}
input[type=text],input[type=datetime-local],textarea{font:inherit;font-size:16px;width:100%;min-height:46px;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:12px;padding:10px 12px;-webkit-appearance:none;appearance:none}
textarea{resize:vertical}
.photo img{width:100%;max-height:260px;object-fit:cover;border-radius:12px;margin-bottom:8px;display:block}
.bristol{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.bristol .legend{display:flex;align-items:center;justify-content:center;text-align:center;color:var(--sub);font-size:12px;padding:0 6px}
.br{display:flex;gap:8px;align-items:center;text-align:left;width:100%;min-width:0;padding:7px 8px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);font:inherit;margin:0}
.br .num{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;flex:none}
.br b{font-size:14px;line-height:1.3}
.br.ok .num{background:var(--accent-weak);color:var(--accent-text)}
.br.warn .num{background:var(--meal-weak);color:var(--meal-text)}
.br.bad .num{background:var(--bad-weak);color:var(--bad)}
.br .tx{display:flex;flex-direction:column;min-width:0}
.br small{color:var(--sub);font-size:11px;line-height:1.3}
.br.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-weak)}
.br.bad.on{border-color:var(--bad);box-shadow:0 0 0 2px var(--bad-weak)}
select{font:inherit;font-size:16px;min-height:40px;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;padding:6px 10px}
.srow{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.srow b{width:44px}
.sec{margin:24px 0 4px;font-size:17px;font-weight:700}
.note{color:var(--sub);font-size:12px;margin:2px 0 10px}
details.ep{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
details.ep summary{font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer;list-style:none}
details.ep summary::-webkit-details-marker{display:none}
details.ep summary::after{content:"▾";color:var(--sub)}
details.ep[open] summary::after{content:"▴"}
.ml{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);align-items:flex-start}
.ml:first-of-type{margin-top:10px}
.ml .ago{width:78px;flex:none;color:var(--sub);font-size:13px;padding-top:2px}
.ml .body{flex:1;min-width:0}
.rk{display:grid;grid-template-columns:26px 1fr auto;gap:4px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.rk:first-child{border-top:0}
.rk .n{color:var(--sub);font-weight:700}
.rk .v{font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}
.bar{grid-column:2/4;height:6px;border-radius:99px;background:var(--bg);overflow:hidden}
.bar i{display:block;height:100%;background:var(--bad);border-radius:99px;opacity:.85}
#tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:20}
#tabs .in{max-width:560px;margin:0 auto;display:flex}
#tabs button{flex:1;border:0;background:none;color:var(--sub);font:inherit;font-size:11px;font-weight:600;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px}
#tabs button.on{color:var(--accent)}
#tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translate(-50%,10px);background:#222;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:90;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="app"><main id="view"></main></div>
<div id="adds"><div class="in"></div></div>
<nav id="tabs"></nav>
<div id="toast"></div>
<script>
(function(){
'use strict';
const $=(s,r=document)=>r.querySelector(s);
function h(tag,attrs,...kids){
  const e=document.createElement(tag);
  if(attrs)for(const k in attrs){
    const v=attrs[k];
    if(v==null||v===false)continue;
    if(k==='class')e.className=v;
    else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v===true?'':v);
  }
  for(const c of kids.flat()){
    if(c==null||c===false)continue;
    e.append(c.nodeType?c:document.createTextNode(c));
  }
  return e;
}

const addAll=(p,...k)=>{k.forEach(c=>{if(c)p.append(c);});};

//#analysis-start
const HOUR=36e5;
function splitItems(text){
  return String(text||'').split(/[、，,・\/／\n\r\s]+/).map(s=>s.trim()).filter(Boolean);
}
function normKey(s){
  return s.normalize('NFKC').toLowerCase()
    .replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60))
    .replace(/\s+/g,'');
}
function isDiarrhea(e,thr){return e.type==='stool'&&e.bristol>=thr;}
function getEpisodes(entries,thr){
  const ds=entries.filter(e=>isDiarrhea(e,thr)).sort((a,b)=>a.t-b.t);
  const eps=[];
  for(const d of ds){
    const last=eps[eps.length-1];
    if(last&&d.t-last.end<12*HOUR){last.events.push(d);last.end=d.t;last.max=Math.max(last.max,d.bristol);}
    else eps.push({start:d.t,end:d.t,max:d.bristol,events:[d]});
  }
  return eps;
}
function mealsBefore(entries,t,W){
  return entries.filter(e=>e.type==='meal'&&e.t<t&&e.t>=t-W*HOUR).sort((a,b)=>b.t-a.t);
}
function ranking(entries,thr,W,now){
  const diar=entries.filter(e=>isDiarrhea(e,thr)).map(e=>e.t).sort((a,b)=>a-b);
  const map=new Map();
  for(const m of entries){
    if(m.type!=='meal')continue;
    const seen=new Map();
    for(const raw of splitItems(m.text)){const k=normKey(raw);if(k&&!seen.has(k))seen.set(k,raw);}
    if(!seen.size)continue;
    const followed=diar.some(d=>d>m.t&&d<=m.t+W*HOUR);
    if(!followed&&m.t>now-W*HOUR)continue;
    for(const [k,raw] of seen){
      let r=map.get(k);
      if(!r){r={key:k,name:raw,n:0,hit:0};map.set(k,r);}
      r.n++;if(followed)r.hit++;
    }
  }
  return [...map.values()];
}
//#analysis-end

/* ---------- 保存まわり ---------- */
const DEMO=false,DEMO_ENTRIES=[];
const DB_NAME=DEMO?'onaka-log-demo':'onaka-log';
const PHOTO_MONTHS=3;
let db=null,dbOK=false,entries=[],tab='log';
let calY=new Date().getFullYear(),calM=new Date().getMonth(),calSel=null;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function openDB(){
  return new Promise((res,rej)=>{
    if(!window.indexedDB)return rej(new Error('no idb'));
    const r=indexedDB.open(DB_NAME,1);
    r.onupgradeneeded=()=>{r.result.createObjectStore('entries',{keyPath:'id'});};
    r.onsuccess=()=>res(r.result);
    r.onerror=()=>rej(r.error);
  });
}
function tx(mode,fn){
  return new Promise((res,rej)=>{
    if(!db)return res();
    const t=db.transaction('entries',mode);
    let out;
    try{out=fn(t.objectStore('entries'));}catch(e){return rej(e);}
    t.oncomplete=()=>res(out&&out.result!==undefined?out.result:undefined);
    t.onerror=()=>rej(t.error);
    t.onabort=()=>rej(t.error);
  });
}
const dbAll=()=>tx('readonly',s=>s.getAll());
const dbPut=list=>tx('readwrite',s=>{list.forEach(e=>s.put(e));});
const dbDel=id=>tx('readwrite',s=>{s.delete(id);});
const dbClear=()=>tx('readwrite',s=>{s.clear();});

const MEALS=['朝','昼','間食','夜'];
const DEF_START={朝:4,昼:10,間食:15,夜:17};
const S={theme:'light',thr:6,win:48,rankSort:'count',lastBackup:0,autoMeal:true,saveSide:'right',logView:'list',firstUse:0,mealStart:{...DEF_START}};
const SKEY=DEMO?'onaka-settings-demo':'onaka-settings';
function loadS(){
  try{Object.assign(S,JSON.parse(localStorage.getItem(SKEY)||'{}'));}catch(e){}
  S.mealStart=Object.assign({},DEF_START,S.mealStart);
  if(DEMO)S.lastBackup=Date.now();
  if(!S.firstUse){S.firstUse=Date.now();if(!DEMO)saveS();}
}
function saveS(){try{localStorage.setItem(SKEY,JSON.stringify(S));}catch(e){}}
function applyTheme(){
  let m=S.theme;
  if(m==='auto')m=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
  document.documentElement.dataset.theme=m;
  const meta=$('meta[name=theme-color]');
  if(meta)meta.setAttribute('content',m==='dark'?'#0e1113':'#ffffff');
}

async function saveEntry(e){
  try{await dbPut([e]);}catch(err){toast('保存に失敗しました');return false;}
  const i=entries.findIndex(x=>x.id===e.id);
  if(i>=0)entries[i]=e;else entries.push(e);
  return true;
}
async function removeEntry(id){
  try{await dbDel(id);}catch(err){toast('削除に失敗しました');return false;}
  entries=entries.filter(x=>x.id!==id);
  return true;
}

async function purgeOldPhotos(){
  const c=new Date();c.setMonth(c.getMonth()-PHOTO_MONTHS);
  const old=entries.filter(e=>e.photo&&e.t<c.getTime());
  if(!old.length)return 0;
  const upd=old.map(e=>{const o={...e,photo:null};if(!o.text)o.photoExpired=true;return o;});
  try{await dbPut(upd);}catch(err){return 0;}
  const m=new Map(upd.map(e=>[e.id,e]));
  entries=entries.map(e=>m.get(e.id)||e);
  return upd.length;
}

/* ---------- 表示用の小道具 ---------- */
const pad=n=>String(n).padStart(2,'0');
const DOW='日月火水木金土';
const fmtTime=t=>{const d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes());};
const fmtDay=t=>{const d=new Date(t);return (d.getMonth()+1)+'月'+d.getDate()+'日（'+DOW[d.getDay()]+'）';};
const fmtShort=t=>{const d=new Date(t);return (d.getMonth()+1)+'/'+d.getDate()+'('+DOW[d.getDay()]+') '+fmtTime(t);};
const fmtFull=t=>new Date(t).getFullYear()+'/'+fmtShort(t);
const dayKey=t=>{const d=new Date(t);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
const toLocalInput=t=>dayKey(t)+'T'+fmtTime(t);
function agoText(ms){
  const m=Math.round(ms/6e4);
  if(m<60)return '約'+Math.max(m,1)+'分前';
  return '約'+Math.round(ms/HOUR)+'時間前';
}
function mealByHour(hr){
  let best=null,top=null;
  for(const k of MEALS){
    const s=S.mealStart[k];
    if(s<=hr&&(best===null||s>S.mealStart[best]))best=k;
    if(top===null||s>S.mealStart[top])top=k;
  }
  return best||top;
}
function initialMeal(t){
  if(S.autoMeal)return mealByHour(new Date(t||Date.now()).getHours());
  const last=entries.filter(e=>e.type==='meal').sort((a,b)=>b.t-a.t)[0];
  return last?last.meal:'朝';
}
function rangeText(){
  const o=MEALS.map(k=>[k,S.mealStart[k]]).sort((a,b)=>a[1]-b[1]);
  return o.map(([k,s],i)=>k+' '+s+'〜'+o[(i+1)%o.length][1]+'時').join('　');
}
const BR=[null,['コロコロ','硬い粒状'],['硬め','硬いかたまり'],['やや硬め','ひび割れあり'],['ふつう','なめらか'],['やや柔らかめ','形はある'],['泥状','形がない'],['水様','液体状']];
const brClass=n=>n>=6?'bad':n<=2?'warn':'ok';
const TAGS=['腹痛','吐き気','発熱','急にもよおす','残った感じ','血が混じる'];

let tt;
function toast(msg){
  const el=$('#toast');el.textContent=msg;el.classList.add('show');
  clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('show'),2200);
}
function seg(opts,val,cb){
  const wrap=h('div',{class:'seg'});
  const draw=()=>wrap.replaceChildren(...opts.map(([v,l])=>h('button',{type:'button',class:v===val?'on':'',onclick:()=>{val=v;draw();cb(v);}},l)));
  wrap.set=v=>{val=v;draw();};
  draw();return wrap;
}
function openSheet(title,build){
  const wrap=h('div',{class:'wrap'});
  const vv=window.visualViewport;
  const fit=()=>{wrap.style.top=vv.offsetTop+'px';wrap.style.height=vv.height+'px';wrap.style.bottom='auto';};
  const close=()=>{
    wrap.remove();document.body.style.overflow='';
    if(vv){vv.removeEventListener('resize',fit);vv.removeEventListener('scroll',fit);}
  };
  const {body,save,dirty}=build(close);
  const cancel=h('button',{type:'button',class:'btn',style:'flex:1',onclick:()=>{
    if(dirty&&dirty()&&!confirm('入力した内容は保存されません。閉じますか？'))return;
    close();
  }},'閉じる');
  save.style.flex='2';
  wrap.append(h('div',{class:'sheet'},
    h('div',{class:'sheet-head'},h('h2',null,title)),
    h('div',{class:'sheet-body'},body),
    h('div',{class:'sheet-foot'},h('div',{class:'row'},S.saveSide==='left'?[save,cancel]:[cancel,save]))));
  document.body.append(wrap);
  document.body.style.overflow='hidden';
  if(vv){vv.addEventListener('resize',fit);vv.addEventListener('scroll',fit);fit();}
}
async function fileToDataURL(file){
  const url=URL.createObjectURL(file);
  try{
    const img=new Image();
    await new Promise((ok,ng)=>{img.onload=ok;img.onerror=ng;img.src=url;});
    const sc=Math.min(1,1000/Math.max(img.width,img.height));
    const c=document.createElement('canvas');
    c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    return c.toDataURL('image/jpeg',0.72);
  }finally{URL.revokeObjectURL(url);}
}
function topItems(n){
  const m=new Map();
  for(const e of entries){
    if(e.type!=='meal')continue;
    const seen=new Set();
    for(const raw of splitItems(e.text)){
      const k=normKey(raw);if(!k||seen.has(k))continue;
      seen.add(k);
      const r=m.get(k)||{name:raw,c:0};r.c++;m.set(k,r);
    }
  }
  return [...m.values()].sort((a,b)=>b.c-a.c).slice(0,n).map(r=>r.name);
}

/* ---------- 入力フォーム ---------- */
function openMealForm(entry,t0){
  const st={meal:entry?entry.meal:initialMeal(t0),photo:entry?entry.photo:null};
  openSheet(entry?'食事を編集':'食事を記録',close=>{
    const root=h('div',{class:'form'});
    let manual=false;
    const mealSeg=seg(['朝','昼','夜','間食'].map(x=>[x,x]),st.meal,v=>{st.meal=v;manual=true;});
    const dt=h('input',{type:'datetime-local',value:toLocalInput(entry?entry.t:(t0||Date.now()))});
    const autoMeal=()=>{
      const t=new Date(dt.value).getTime();
      if(manual||!S.autoMeal||isNaN(t))return;
      const m=mealByHour(new Date(t).getHours());
      st.meal=m;mealSeg.set(m);
    };
    dt.addEventListener('input',autoMeal);dt.addEventListener('change',autoMeal);
    const hint=h('div',{class:'note'});
    const prev=h('div',{class:'chips small'});
    const ta=h('textarea',{rows:3,placeholder:'例：白ごはん、味噌汁、納豆',oninput:()=>drawPrev()});
    ta.value=entry?entry.text:'';
    const drawPrev=()=>{
      const items=splitItems(ta.value);
      prev.replaceChildren(...items.map(x=>h('span',{class:'chip'},x)));
      hint.textContent=items.length?items.length+'品として数えます':'「、」や改行で区切ると、分析で1品ずつ数えられます';
    };
    const recent=topItems(12);
    const recentBox=recent.length?h('div',null,
      h('div',{class:'lab'},'よく食べるもの（タップで追加）'),
      h('div',{class:'chips'},recent.map(x=>h('button',{type:'button',class:'chip tap',onclick:()=>{
        const v=ta.value.trimEnd();
        ta.value=v&&!/[、,，]$/.test(v)?v+'、'+x:v+x;
        drawPrev();
      }},x)))):null;
    const photoBox=h('div',{class:'photo'});
    const drawPhoto=()=>photoBox.replaceChildren(...(st.photo?[
      h('img',{src:st.photo,alt:'食事の写真'}),
      h('button',{type:'button',class:'btn small danger',onclick:()=>{st.photo=null;drawPhoto();}},'写真を外す')]:[]));
    async function pick(ev){
      const f=ev.target.files[0];ev.target.value='';
      if(!f)return;
      try{st.photo=await fileToDataURL(f);drawPhoto();}catch(err){toast('写真を読み込めませんでした');}
    }
    const cam=h('input',{type:'file',accept:'image/*',capture:'environment',hidden:true,onchange:pick});
    const lib=h('input',{type:'file',accept:'image/*',hidden:true,onchange:pick});
    const save=h('button',{class:'btn primary',type:'button',onclick:async()=>{
      const text=ta.value.trim();
      const t=new Date(dt.value).getTime();
      if(isNaN(t)){toast('日時を入れてください');return;}
      if(!text&&!st.photo){toast('食べた物か写真を入れてください');return;}
      const e={id:entry?entry.id:uid(),type:'meal',t,meal:st.meal,text,photo:st.photo||null};
      if(await saveEntry(e)){close();render();toast('保存しました');}
    }},'保存');
    addAll(root,
      h('div',null,h('div',{class:'lab'},'区分'),mealSeg),
      h('div',null,h('div',{class:'lab'},'日時'),dt),
      h('div',null,h('div',{class:'lab'},'食べた物'),ta,hint,prev),
      recentBox,
      h('div',null,h('div',{class:'lab'},'写真（任意）'),
        h('div',{class:'row'},
          h('button',{type:'button',class:'btn',onclick:()=>cam.click()},'カメラで撮る'),
          h('button',{type:'button',class:'btn',onclick:()=>lib.click()},'写真を選ぶ')),
        cam,lib,h('div',{style:'height:8px'}),photoBox,h('div',{class:'note'},'写真は、この記録の日時から3か月たつと自動で削除されます（文字の記録は残ります）。')),
      entry?h('button',{type:'button',class:'btn block danger',onclick:async()=>{
        if(confirm('この記録を削除しますか？')&&await removeEntry(entry.id)){close();render();toast('削除しました');}
      }},'削除'):null
    );
    drawPrev();drawPhoto();
    const snap=()=>JSON.stringify([dt.value,st.meal,ta.value.trim(),st.photo?st.photo.length:0]);
    const base=snap();
    return {body:root,save,dirty:()=>snap()!==base};
  });
}

function openStoolForm(entry,t0){
  const st={br:entry?entry.bristol:0,tags:new Set(entry?entry.tags||[]:[])};
  openSheet(entry?'うんを編集':'うんを記録',close=>{
    const root=h('div',{class:'form'});
    const dt=h('input',{type:'datetime-local',value:toLocalInput(entry?entry.t:(t0||Date.now()))});
    const list=h('div',{class:'bristol'});
    const drawList=()=>list.replaceChildren(...[1,2,3,4,5,6,7].map(n=>h('button',{
      type:'button',class:'br '+brClass(n)+(st.br===n?' on':''),onclick:()=>{st.br=n;drawList();}},
      h('span',{class:'num'},n),
      h('span',{class:'tx'},h('b',null,BR[n][0]),h('small',null,BR[n][1])))),
      h('div',{class:'legend'},'6〜7は下したときの目安'));
    const tagBox=h('div',{class:'chips'});
    const drawTags=()=>tagBox.replaceChildren(...TAGS.map(x=>h('button',{type:'button',class:'chip tap'+(st.tags.has(x)?' on':''),onclick:()=>{
      if(st.tags.has(x))st.tags.delete(x);else st.tags.add(x);
      drawTags();
    }},x)));
    const memo=h('input',{type:'text',placeholder:'メモ（任意）　例：おなかがキリキリ痛む'});
    memo.value=entry?entry.memo||'':'';
    const save=h('button',{class:'btn primary',type:'button',onclick:async()=>{
      const t=new Date(dt.value).getTime();
      if(isNaN(t)){toast('日時を入れてください');return;}
      if(!st.br){toast('うんの状態を選んでください');return;}
      const e={id:entry?entry.id:uid(),type:'stool',t,bristol:st.br,tags:[...st.tags],memo:memo.value.trim()};
      if(await saveEntry(e)){close();render();toast('保存しました');}
    }},'保存');
    addAll(root,
      h('div',null,h('div',{class:'lab'},'日時'),dt),
      h('div',null,h('div',{class:'lab'},'うんの状態（ブリストルスケール）'),list),
      h('div',null,h('div',{class:'lab'},'いっしょにあった症状'),tagBox),
      h('div',null,h('div',{class:'lab'},'メモ'),memo),
      entry?h('button',{type:'button',class:'btn block danger',onclick:async()=>{
        if(confirm('この記録を削除しますか？')&&await removeEntry(entry.id)){close();render();toast('削除しました');}
      }},'削除'):null
    );
    drawList();drawTags();
    const snap=()=>JSON.stringify([dt.value,st.br,[...st.tags].sort(),memo.value.trim()]);
    const base=snap();
    return {body:root,save,dirty:()=>snap()!==base};
  });
}

/* ---------- 画面 ---------- */
function entryRow(e){
  const body=e.type==='meal'
    ?h('div',{class:'body'},
        h('span',{class:'tag meal'},e.meal),
        h('div',{class:'c'},e.text?h('span',{class:'text'},e.text):h('span',{class:'text sub'},e.photoExpired?'（写真のみ・削除済み）':'（写真のみ）')))
    :h('div',{class:'body'},
        h('span',{class:'tag '+brClass(e.bristol)},'うん '+e.bristol),
        h('div',{class:'c'},
          h('span',{class:'text'},BR[e.bristol][0]),
          ...(e.tags||[]).map(x=>h('span',{class:'chip'},x)),
          e.memo?h('span',{class:'memo'},e.memo):null));
  return h('div',{class:'entry',role:'button',tabindex:'0',onclick:()=>e.type==='meal'?openMealForm(e):openStoolForm(e)},
    h('div',{class:'t'},fmtTime(e.t)),body,e.photo?h('img',{class:'thumb',src:e.photo,alt:''}):null);
}

function timelineNode(){
  const box=h('div');
  const hasD=new Set(entries.filter(e=>isDiarrhea(e,S.thr)).map(e=>dayKey(e.t)));
  const sorted=[...entries].sort((a,b)=>b.t-a.t);
  let cur='';
  for(const e of sorted){
    const k=dayKey(e.t);
    if(k!==cur){cur=k;box.append(h('div',{class:'day'},fmtDay(e.t),hasD.has(k)?h('span',{class:'tag bad'},'下した'):null));}
    box.append(entryRow(e));
  }
  return box;
}
function calNode(){
  const box=h('div');
  const now=new Date();
  const td={y:now.getFullYear(),m:now.getMonth(),d:now.getDate()};
  if(!calSel)calSel=td;
  const keyOf=(y,m,d)=>y+'-'+pad(m+1)+'-'+pad(d);
  const info=new Map();
  for(const e of entries){
    const k=dayKey(e.t);
    let r=info.get(k);if(!r){r={meal:0,stool:0,y:0,g:0,r:0,bad:false};info.set(k,r);}
    if(e.type==='meal')r.meal++;else{r.stool++;if(e.bristol<=2)r.y++;else if(e.bristol<=5)r.g++;else r.r++;if(isDiarrhea(e,S.thr))r.bad=true;}
  }
  const go=n=>{
    let m=calM+n,y=calY;
    if(m<0){m=11;y--;}else if(m>11){m=0;y++;}
    calY=y;calM=m;calSel=(y===td.y&&m===td.m)?td:{y,m,d:1};
    render();
  };
  box.append(h('div',{class:'calhead'},
    h('button',{class:'calnav',type:'button','aria-label':'前の月',onclick:()=>go(-1)},'‹'),
    h('div',{class:'caltitle'},calY+'年'+(calM+1)+'月'),
    h('button',{class:'calnav',type:'button','aria-label':'次の月',onclick:()=>go(1)},'›'),
    h('button',{class:'btn small',type:'button',onclick:()=>{calY=td.y;calM=td.m;calSel=td;render();}},'今日')));
  const grid=h('div',{class:'cal'});
  [...'日月火水木金土'].forEach((w,i)=>grid.append(h('div',{class:'dow'+(i===0?' sun':i===6?' sat':'')},w)));
  const first=new Date(calY,calM,1).getDay(),dim=new Date(calY,calM+1,0).getDate();
  for(let i=0;i<first;i++)grid.append(h('div',{class:'cell blank'}));
  for(let d=1;d<=dim;d++){
    const r=info.get(keyOf(calY,calM,d));
    const isToday=calY===td.y&&calM===td.m&&d===td.d;
    const isSel=calSel.y===calY&&calSel.m===calM&&calSel.d===d;
    grid.append(h('button',{type:'button',
      class:'cell'+(r&&r.bad?' bad':'')+(isToday?' today':'')+(isSel?' sel':''),
      onclick:()=>{calSel={y:calY,m:calM,d};render();}},
      h('span',{class:'dn'},d),
      h('span',{class:'sc'},r&&r.y?h('i',{class:'cy'},r.y):null,r&&r.g?h('i',{class:'cg'},r.g):null,r&&r.r?h('i',{class:'cr'},r.r):null)));
  }
  box.append(grid,h('div',{style:'height:8px'}));
  const sk=keyOf(calSel.y,calSel.m,calSel.d);
  const list=entries.filter(e=>dayKey(e.t)===sk).sort((a,b)=>a.t-b.t);
  const sr=info.get(sk);
  box.append(h('div',{class:'day'},fmtDay(new Date(calSel.y,calSel.m,calSel.d).getTime()),sr&&sr.bad?h('span',{class:'tag bad'},'下した'):null));
  if(!list.length)box.append(h('div',{class:'empty',style:'padding:18px'},'この日の記録はありません'));
  list.forEach(e=>box.append(entryRow(e)));
  return box;
}
function addTime(){
  if(tab==='log'&&S.logView==='cal'&&calSel){
    const n=new Date();
    if(calSel.y===n.getFullYear()&&calSel.m===n.getMonth()&&calSel.d===n.getDate())return Date.now();
    return new Date(calSel.y,calSel.m,calSel.d,n.getHours(),n.getMinutes()).getTime();
  }
  return Date.now();
}
function viewLog(){
  const v=h('div');
  v.append(h('h1',null,'おなかログ'),h('div',{class:'sub'},fmtDay(Date.now())));
  v.append(h('div',{style:'margin:12px 0'},seg([['list','タイムライン'],['cal','カレンダー']],S.logView,x=>{S.logView=x;saveS();render();})));
  if(!dbOK)v.append(h('div',{class:'banner'},h('span',null,'この環境ではデータを保存できません。プライベートブラウズでは使えません。')));
  else if(entries.length&&Date.now()-(S.lastBackup||S.firstUse)>30*24*HOUR)
    v.append(h('div',{class:'banner'},
      h('span',null,S.lastBackup?'最後のバックアップは '+fmtFull(S.lastBackup)+' です（30日以上たちました）':'まだバックアップを取っていません（使い始めて30日以上たちました）'),
      h('button',{class:'btn',type:'button',onclick:()=>setTab('settings')},'設定へ')));
  if(S.logView==='cal'){v.append(calNode());return v;}
  if(!entries.length){
    v.append(h('div',{class:'empty'},'まだ記録がありません。下のボタンから、食事か、うんを記録してください。'));
    return v;
  }
  v.append(timelineNode());
  return v;
}

function viewAnalysis(){
  const v=h('div');
  const W=S.win,thr=S.thr;
  v.append(h('h1',null,'分析'));
  v.append(h('div',{class:'sub',style:'margin-bottom:12px'},'下した＝ブリストル'+thr+(thr===7?'':'以上')+'のうん（設定で変更できます）'));
  v.append(h('div',{class:'lab'},'さかのぼる時間'),seg([[24,'24時間'],[48,'48時間']],W,x=>{S.win=x;saveS();render();}));
  const eps=getEpisodes(entries,thr);
  const nm=entries.filter(e=>e.type==='meal').length,ns=entries.length-nm;
  v.append(h('div',{class:'sub',style:'margin:10px 2px 0'},'食事 '+nm+'件 ／ うん '+ns+'件 ／ 下した '+eps.length+'回'));
  if(!eps.length){
    v.append(h('div',{class:'empty'},'下した記録がまだありません。記録がたまると、ここに「前に食べた物」の一覧とランキングが出ます。'));
    return v;
  }
  v.append(h('div',{class:'sec'},'下す前に食べた物'));
  v.append(h('div',{class:'note'},'下し始めた時刻から、'+W+'時間さかのぼった食事です。近い順に並んでいます。'));
  [...eps].reverse().forEach((ep,i)=>{
    const ms=mealsBefore(entries,ep.start,W);
    const d=h('details',{class:'ep'},h('summary',null,
      h('span',null,fmtShort(ep.start)),
      h('span',{class:'tag bad'},'うん '+ep.max+(ep.events.length>1?'（'+ep.events.length+'回）':''))));
    if(i===0)d.setAttribute('open','');
    if(!ms.length)d.append(h('div',{class:'note',style:'margin-top:10px'},'この間の食事の記録がありません（記録もれの可能性があります）'));
    ms.forEach(m=>d.append(h('div',{class:'ml'},
      h('div',{class:'ago'},agoText(ep.start-m.t)),
      h('div',{class:'body'},h('span',{class:'tag meal'},m.meal),' ',m.text?h('span',{class:'text'},m.text):h('span',{class:'sub'},m.photoExpired?'（写真のみ・削除済み）':'（写真のみ）')),
      m.photo?h('img',{class:'thumb',src:m.photo,alt:'',style:'width:44px;height:44px'}):null)));
    v.append(d);
  });

  v.append(h('div',{class:'sec'},'下す前に食べた物ランキング'));
  v.append(seg([['count','回数順'],['rate','割合順']],S.rankSort,x=>{S.rankSort=x;saveS();render();}));
  let rows=ranking(entries,thr,W,Date.now()).filter(r=>r.hit>0);
  if(S.rankSort==='rate'){
    rows=rows.filter(r=>r.n>=2).sort((a,b)=>(b.hit/b.n-a.hit/a.n)||b.hit-a.hit);
    v.append(h('div',{class:'note',style:'margin-top:8px'},'2回以上食べた物だけを、「食べた回のうち、その後に下した割合」の高い順に並べています。'));
  }else{
    rows.sort((a,b)=>b.hit-a.hit||(b.hit/b.n-a.hit/a.n));
    v.append(h('div',{class:'note',style:'margin-top:8px'},'食べてから'+W+'時間以内に下した回数の多い順です。白ごはんなど毎日食べる物は回数が多くなりがちなので、右側の割合もあわせて見てください。'));
  }
  rows=rows.slice(0,20);
  if(!rows.length)v.append(h('div',{class:'empty'},'表示できる食べ物がありません。食べた物の名前を入れて記録すると集計されます。'));
  else{
    const max=Math.max(...rows.map(r=>r.hit));
    const box=h('div',{class:'card'});
    rows.forEach((r,i)=>box.append(h('div',{class:'rk'},
      h('div',{class:'n'},i+1),
      h('div',null,r.name),
      h('div',{class:'v'},r.n+'回中 '+r.hit+'回（'+Math.round(r.hit/r.n*100)+'%）'),
      h('div',{class:'bar'},h('i',{style:'width:'+Math.round(r.hit/max*100)+'%'})))));
    v.append(box);
  }
  v.append(h('div',{class:'note'},'写真だけの記録は集計に入りません。うんの記録が抜けていると、結果がずれます。原因を決めつけるものではなく、目安として使ってください。血便・高熱・強い腹痛が続くときは医療機関に相談してください。'));
  return v;
}

function csvCell(x){x=String(x==null?'':x);return /[",\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x;}
async function shareOrDownload(name,blob){
  const file=new File([blob],name,{type:blob.type});
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return true;}
  }catch(e){if(e&&e.name==='AbortError')return false;}
  const a=h('a',{href:URL.createObjectURL(blob),download:name});
  document.body.append(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},4000);
  return true;
}
function clean(e){
  if(!e||typeof e!=='object')return null;
  const t=Number(e.t);if(!isFinite(t))return null;
  const id=String(e.id||uid());
  if(e.type==='meal')return{id,type:'meal',t,meal:['朝','昼','夜','間食'].includes(e.meal)?e.meal:'間食',text:String(e.text||''),
    photo:typeof e.photo==='string'&&e.photo.startsWith('data:image/')?e.photo:null,photoExpired:!!e.photoExpired};
  if(e.type==='stool'){
    const b=Math.round(Number(e.bristol));if(!(b>=1&&b<=7))return null;
    return{id,type:'stool',t,bristol:b,tags:Array.isArray(e.tags)?e.tags.map(String).slice(0,10):[],memo:String(e.memo||'')};
  }
  return null;
}
async function importFile(f){
  try{
    const data=JSON.parse(await f.text());
    const list=(data.entries||[]).map(clean).filter(Boolean);
    if(!list.length){toast('復元できる記録がありません');return;}
    if(!confirm(list.length+'件の記録を読み込みます。同じ記録は上書きされます。よろしいですか？'))return;
    await dbPut(list);
    const map=new Map(entries.map(e=>[e.id,e]));
    list.forEach(e=>map.set(e.id,e));
    entries=[...map.values()];
    await purgeOldPhotos();
    render();toast(list.length+'件を復元しました');
  }catch(err){toast('ファイルを読み込めませんでした');}
}

function viewSettings(){
  const v=h('div');
  v.append(h('h1',null,'設定'),h('div',{style:'height:12px'}));
  v.append(h('div',{class:'card'},h('h3',null,'見た目'),
    seg([['light','ライト'],['dark','ダーク'],['auto','端末に合わせる']],S.theme,x=>{S.theme=x;saveS();applyTheme();})));
  v.append(h('div',{class:'card'},h('h3',null,'下したとみなす基準'),
    seg([[5,'5以上'],[6,'6以上'],[7,'7のみ']],S.thr,x=>{S.thr=x;saveS();}),
    h('div',{class:'note',style:'margin-top:8px'},'ブリストルスケールの数字です。分析と「下した」の表示に使います。')));
  const rangeEl=h('div',{class:'note',style:'margin:8px 0 0'});
  const upd=()=>{rangeEl.textContent='現在の区切り：'+rangeText();};
  const rows=MEALS.map(k=>{
    const sel=h('select',{onchange:()=>{S.mealStart[k]=Number(sel.value);saveS();upd();}},
      ...Array.from({length:24},(_,n)=>h('option',{value:n},n+'時')));
    sel.value=String(S.mealStart[k]);
    return h('div',{class:'srow'},h('b',null,k),sel,h('span',{class:'sub'},'から'));
  });
  upd();
  v.append(h('div',{class:'card'},h('h3',null,'食事の区分の自動選択'),
    seg([[true,'オン'],[false,'オフ']],S.autoMeal,x=>{S.autoMeal=x;saveS();}),
    h('div',{class:'note',style:'margin:8px 0 6px'},'食事の日時に合わせて、朝・昼・間食・夜を自動で選びます。各区分は、次の区分の開始時刻まで続きます。オフにすると、前回の食事と同じ区分から始まります。'),
    ...rows,rangeEl,
    h('button',{class:'btn small',type:'button',style:'margin-top:8px',onclick:()=>{S.mealStart={...DEF_START};saveS();render();}},'初期値に戻す')));
  v.append(h('div',{class:'card'},h('h3',null,'入力画面のボタンの位置'),
    seg([['right','保存を右'],['left','保存を左']],S.saveSide,x=>{S.saveSide=x;saveS();}),
    h('div',{class:'note',style:'margin-top:8px'},'入力画面の下に「閉じる」と「保存」が並びます。利き手に合わせて入れ替えられます。')));
  const info=h('div',{class:'note'});
  if(navigator.storage&&navigator.storage.estimate)navigator.storage.estimate().then(r=>{info.textContent='このアプリの使用量：約'+(r.usage/1048576).toFixed(1)+'MB';}).catch(()=>{});
  const restore=h('input',{type:'file',accept:'application/json,.json',hidden:true,onchange:ev=>{const f=ev.target.files[0];ev.target.value='';if(f)importFile(f);}});
  v.append(h('div',{class:'card stack'},h('h3',null,'データ'),
    h('div',{class:'note'},'記録は '+entries.length+' 件。最後のバックアップ：'+(S.lastBackup?fmtFull(S.lastBackup):'なし')),
    h('div',{class:'note'},'写真は、記録の日時から3か月たつと自動で削除されます。文字の記録は残ります。'),
    h('button',{class:'btn block primary',type:'button',onclick:async()=>{
      const blob=new Blob([JSON.stringify({app:'onaka-log',version:1,exported:Date.now(),entries})],{type:'application/json'});
      if(await shareOrDownload('onaka-log-backup-'+dayKey(Date.now())+'.json',blob)){S.lastBackup=Date.now();saveS();render();toast('書き出しました');}
    }},'バックアップを書き出す（写真つき）'),
    h('div',{class:'note'},'書き出すときに選んだ場所（ファイルアプリ、iCloud Drive、AirDropなど）に保存されます。30日以上バックアップがないと、記録画面でお知らせします。'),
    h('button',{class:'btn block',type:'button',onclick:async()=>{
      const rows=[['日時','種類','区分','内容','ブリストル','症状','メモ']];
      [...entries].sort((a,b)=>a.t-b.t).forEach(e=>rows.push([dayKey(e.t)+' '+fmtTime(e.t),e.type==='meal'?'食事':'うん',e.meal||'',e.text||'',e.bristol||'',(e.tags||[]).join('/'),e.memo||'']));
      const blob=new Blob(['﻿'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n')],{type:'text/csv'});
      await shareOrDownload('onaka-log-'+dayKey(Date.now())+'.csv',blob);
    }},'CSVで書き出す（写真なし）'),
    h('button',{class:'btn block',type:'button',onclick:()=>restore.click()},'バックアップから復元する'),restore,
    h('button',{class:'btn block danger',type:'button',onclick:async()=>{
      if(!entries.length){toast('削除する記録がありません');return;}
      if(!confirm('すべての記録を削除します。元に戻せません。よろしいですか？'))return;
      if(!confirm('本当に削除しますか？（バックアップを取っていない場合は消えます）'))return;
      try{await dbClear();entries=[];render();toast('すべて削除しました');}catch(err){toast('削除に失敗しました');}
    }},'すべての記録を削除'),info));
  v.append(h('div',{class:'card'},h('h3',null,'このアプリについて'),
    h('div',{class:'note',style:'font-size:13px'},'記録はこのiPhoneの中だけに保存され、外部には送信されません。ホーム画面に追加したアイコンから開いたときの記録は、Safariで直接開いたときの記録とは別に保存されます。機種変更や端末の初期化に備えて、ときどきバックアップを書き出してください。ホーム画面のアイコンを削除すると、記録も消えます。')));
  return v;
}

/* ---------- 画面切り替え ---------- */
const ICONS={
  log:'<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>',
  analysis:'<path d="M5 20V10M12 20V4M19 20v-7"/>',
  settings:'<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>'
};
function drawTabs(){
  const nav=$('#tabs');
  nav.replaceChildren(h('div',{class:'in'},...[['log','記録'],['analysis','分析'],['settings','設定']].map(([k,l])=>{
    const b=h('button',{type:'button',class:tab===k?'on':'',onclick:()=>setTab(k)},l);
    const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.setAttribute('viewBox','0 0 24 24');svg.innerHTML=ICONS[k];
    b.prepend(svg);
    return b;
  })));
}
function setTab(k){tab=k;render();window.scrollTo(0,0);}
function render(){
  $('#view').replaceChildren(tab==='log'?viewLog():tab==='analysis'?viewAnalysis():viewSettings());
  $('#adds').style.display=tab==='log'?'':'none';
  drawTabs();
}

(async function init(){
  loadS();applyTheme();
  $('#adds .in').append(
    h('button',{class:'btn add-meal',type:'button',onclick:()=>openMealForm(null,addTime())},'＋ 食事'),
    h('button',{class:'btn add-stool',type:'button',onclick:()=>openStoolForm(null,addTime())},'＋ うん'));
  try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(S.theme==='auto')applyTheme();});}catch(e){}
  try{
    db=await openDB();dbOK=true;
    if(DEMO){
      await dbClear();
      const now=Date.now();
      await dbPut(DEMO_ENTRIES.map((e,i)=>{const o={...e,id:'demo'+i,t:now-e.ago*HOUR};delete o.ago;return o;}));
    }
    entries=(await dbAll())||[];
    await purgeOldPhotos();
  }catch(e){dbOK=false;}
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
  render();
})();
})();
